name: DNL image

# DNL's LiteLLM gateway image, built from this fork's dnl/main* integration branches
# (upstream release tag + DNL patches carried as commits).
#   pull_request -> dnl/main* : unit tests, image build, in-image smoke tests. Nothing is published.
#   push to dnl/main* (merge) : the same, then push ghcr.io/deepneuronlab/litellm:v<upstream>-dnl.<N>,
#                               attest provenance and publish a GitHub Release tagged v<upstream>-dnl.<N>.

on:
  pull_request:
    branches: ["dnl/main", "dnl/main-*"]
  push:
    branches: ["dnl/main", "dnl/main-*"]

concurrency:
  group: dnl-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Score against the cost map shipped in this tree, not upstream main's live copy.
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  unit-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"

      - name: Install dependencies
        run: uv sync --frozen --group ci --group proxy-dev --extra google --extra proxy --extra semantic-router

      - name: Generate Prisma client
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      # Suites covering the code DNL patches touch; extend when a patch lands elsewhere.
      - name: Run tests
        run: |
          uv run --no-sync pytest \
            tests/unit/llms/azure \
            tests/unit/llms/openai \
            tests/unit/llms/cohere \
            tests/unit/responses \
            tests/unit/decisions \
            tests/unit/proxy/auth \
            tests/unit/proxy/agent_endpoints/auth \
            tests/unit/proxy/decisions_endpoints \
            tests/unit/proxy/response_api_endpoints \
            tests/unit/proxy/spend_tracking \
            tests/unit/proxy/test__lazy_features.py \
            tests/unit/integrations/test_prometheus_labels.py \
            tests/unit/test_router_azure_gpt5_series_metadata.py \
            --tb=short -n 4 --dist=loadscope

  image:
    needs: unit-tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # Write scopes are only exercised by the push-gated steps; pull_request runs
    # from forks get a read-only token regardless.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          upstream="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          prefix="v${upstream}-dnl."
          if [ "$EVENT_NAME" = pull_request ]; then
            version="${prefix}pr${PR_NUMBER}"
          else
            max=0
            existing=""
            while read -r tag sha; do
              n="${tag#"$prefix"}"
              [[ "$n" =~ ^[0-9]+$ ]] || continue
              if [ "$sha" = "$GITHUB_SHA" ]; then existing="$tag"; fi
              if (( n > max )); then max=$n; fi
            done < <(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${prefix}" \
              --jq '.[] | "\(.ref | ltrimstr("refs/tags/")) \(.object.sha)"')
            if [ -n "$existing" ]; then
              echo "::error::${GITHUB_SHA} is already released as ${existing}; refusing to overwrite its image"
              exit 1
            fi
            # v1.88.1-dnl.1 and .2 were hand-built overlays from deepneuronlab/infrastructure
            # images/litellm-gateway (ACR only); this series continues after them.
            if [ "$upstream" = "1.88.1" ] && (( max < 2 )); then max=2; fi
            version="${prefix}$((max + 1))"
          fi
          {
            echo "upstream=${upstream}"
            echo "version=${version}"
            echo "short=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${version} (upstream ${upstream})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ steps.version.outputs.short }}
          # org.opencontainers.image.source links the GHCR package to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.title=litellm
            org.opencontainers.image.description=DNL LiteLLM gateway: BerriAI/litellm v${{ steps.version.outputs.upstream }} with DNL patches
          cache-from: type=gha,scope=dnl-image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=dnl-image,mode=max' || '' }}

      - name: Run DNL regression tests inside the image
        env:
          LOCAL_IMAGE: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
        run: |
          docker run --rm -e LITELLM_LOCAL_MODEL_COST_MAP \
            -v "$PWD/tests/unit/proxy/response_api_endpoints/test_azure_openai_responses_route.py:/dnl-tests/test_azure_openai_responses_route.py:ro" \
            -v "$PWD/tests/unit/proxy/decisions_endpoints/test_azure_openai_decisions.py:/dnl-tests/test_azure_openai_decisions.py:ro" \
            -w /dnl-tests --entrypoint python3 "$LOCAL_IMAGE" \
            -m unittest -v test_azure_openai_responses_route test_azure_openai_decisions

      - name: Boot the proxy
        env:
          LOCAL_IMAGE: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
        run: |
          docker run -d --name dnl-litellm-smoke -e LITELLM_LOCAL_MODEL_COST_MAP -p 4000:4000 "$LOCAL_IMAGE" --port 4000
          for _ in $(seq 1 90); do
            if curl -fs -o /dev/null http://127.0.0.1:4000/health/liveliness; then
              # The Azure SDK aliases are hidden from /openapi.json; a native handler answers a bad model with
              # a model error, while the OpenAI pass-through it must not fall into demands OPENAI_API_KEY.
              body="$(curl -s -X POST http://127.0.0.1:4000/openai/responses -H 'Content-Type: application/json' -d '{"model":"dnl-smoke-missing","input":"hi"}')"
              echo "$body"
              if grep -q OPENAI_API_KEY <<<"$body"; then exit 1; fi
              exit 0
            fi
            sleep 2
          done
          docker logs dnl-litellm-smoke
          exit 1

      - name: Stop the proxy
        if: always()
        run: docker rm -f dnl-litellm-smoke || true

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHORT: ${{ steps.version.outputs.short }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:sha-${SHORT}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}:${VERSION}@${digest}"

      - name: Attest image provenance
        if: github.event_name == 'push'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM: ${{ steps.version.outputs.upstream }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')"
          notes="$(cat <<EOF
          Image: \`${IMAGE}:${VERSION}\`
          Pin by digest: \`${IMAGE}@${DIGEST}\`
          Upstream base: [BerriAI/litellm v${UPSTREAM}](https://github.com/BerriAI/litellm/releases/tag/v${UPSTREAM})
          Built from: ${GITHUB_SHA} ([workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))

          Verify provenance: \`gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}\`
          EOF
          )"
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --notes "$notes" --generate-notes --latest)
          if [ -n "$previous" ]; then args+=(--notes-start-tag "$previous"); fi
          gh release create "$VERSION" "${args[@]}"
