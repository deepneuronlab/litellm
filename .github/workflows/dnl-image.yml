name: DNL image

# DNL's LiteLLM gateway image, built from this fork's dnl/main* integration branches
# (upstream release tag + DNL patches carried as commits).
#   pull_request -> dnl/main* : unit tests, then the read-only `image` job builds and smoke-tests.
#                               Nothing is published and no write scope is granted.
#   push to dnl/main* (merge) : unit tests, then the `publish` job builds, smoke-tests and pushes
#                               ghcr.io/deepneuronlab/litellm:v<upstream>-dnl.<N> in one job, attests
#                               provenance and publishes a GitHub Release tagged v<upstream>-dnl.<N>.
# Shared build/smoke steps: .github/actions/dnl-image-build.

on:
  pull_request:
    branches: ["dnl/main", "dnl/main-*"]
  push:
    branches: ["dnl/main", "dnl/main-*"]

concurrency:
  group: dnl-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Score against the cost map shipped in this tree, not upstream main's live copy.
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  unit-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"

      - name: Install dependencies
        run: uv sync --frozen --group ci --group proxy-dev --extra google --extra proxy --extra semantic-router

      - name: Cache Prisma binaries
        uses: ./.github/actions/cache-prisma-binaries

      - name: Generate Prisma client
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      # Suites covering the code DNL patches touch; extend when a patch lands elsewhere.
      - name: Run tests
        run: |
          uv run --no-sync pytest \
            tests/unit/llms/azure \
            tests/unit/llms/openai \
            tests/unit/llms/cohere \
            tests/unit/responses \
            tests/unit/decisions \
            tests/unit/proxy/auth \
            tests/unit/proxy/agent_endpoints/auth \
            tests/unit/proxy/decisions_endpoints \
            tests/unit/proxy/response_api_endpoints \
            tests/unit/proxy/spend_tracking \
            tests/unit/proxy/test__lazy_features.py \
            tests/unit/integrations/test_prometheus_labels.py \
            tests/unit/test_router_azure_gpt5_series_metadata.py \
            --tb=short -n 4 --dist=loadscope

  # pull_request: build and smoke-test with the workflow's read-only token. Nothing is published.
  image:
    if: github.event_name == 'pull_request'
    needs: unit-tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Build and smoke-test
        uses: ./.github/actions/dnl-image-build
        with:
          image: ${{ env.IMAGE }}
          github-token: ${{ github.token }}

  # push to dnl/main* only: build, smoke-test and publish in one job, so the pushed digest is
  # the image that was just tested. The only job that holds write scopes.
  publish:
    if: github.event_name == 'push'
    needs: unit-tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Build and smoke-test
        id: version
        uses: ./.github/actions/dnl-image-build
        with:
          image: ${{ env.IMAGE }}
          github-token: ${{ github.token }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHORT: ${{ steps.version.outputs.short }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:sha-${SHORT}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}:${VERSION}@${digest}"

      - name: Attest image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM: ${{ steps.version.outputs.upstream }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')"
          notes="$(cat <<EOF
          Image: \`${IMAGE}:${VERSION}\`
          Pin by digest: \`${IMAGE}@${DIGEST}\`
          Upstream base: [BerriAI/litellm v${UPSTREAM}](https://github.com/BerriAI/litellm/releases/tag/v${UPSTREAM})
          Built from: ${GITHUB_SHA} ([workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))

          Verify provenance: \`gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}\`
          EOF
          )"
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --notes "$notes" --generate-notes --latest)
          if [ -n "$previous" ]; then args+=(--notes-start-tag "$previous"); fi
          gh release create "$VERSION" "${args[@]}"
